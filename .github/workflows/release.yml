name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（例如 v3.0.0）"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout installer
        uses: actions/checkout@v4

      - name: Checkout main app (same tag)
        uses: actions/checkout@v4
        with:
          repository: mmccz/MaaAuto-Tool-works
          ref: ${{ env.TAG }}
          path: mainapp

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mainapp/MaaAutoProject/requirements.txt
          pip install pyinstaller
          pip install -r MaaAutoInstaller/requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build release assets
        run: |
          python MaaAutoInstaller/build_release.py `
            --source-dir mainapp/MaaAutoProject `
            --iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Build Source.zip (2.x 过渡用)
        run: |
          cd mainapp/MaaAutoProject
          python publish.py --skip-build

      - name: Collect assets
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item MaaAuto-Installer/dist/*.exe out/
          Copy-Item MaaAuto-Installer/dist/*.zip out/
          Copy-Item MaaAuto-Installer/dist/SHA256SUMS.txt out/
          Copy-Item mainapp/MaaAutoProject/release/MaaAuto_Source.zip out/
          Get-ChildItem out | Format-Table Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MaaAuto ${{ env.TAG }}
          draft: true
          generate_release_notes: false
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
